 FRA_our_old_allies_desc: "Powinniśmy próbować przywrócić nasze stare sojusze z krajami Europy Zachodniej. Nadal potrzebują naszej pomocy i nie powinniśmy ich zapomnieć"
 FRA_POL_LIT_union: "Unia Polsko-Litewska"
 FRA_empire: "Wzmocnienie Imperium Francuskiego"
 FRA_force_de_frappe: "Siła Uderzeniowa"
 FRA_joint_war_planning: "Wspólne Planowanie Wojenne"
 FRA_a_trip_to_quebec: "Podróż do Quebecu"
 FRA_infulence_the_americas: "Przygotowania do wojny w Amerykach"
 FRA_crush_the_threat_to_indochina: "Przytłoczenie Zagrożenia dla Indochin"
 FRA_empire_francais_desc: "Imperium Francuskie jest największym imperium na świecie i powinniśmy zrobić wszystko, aby go rozszerzyć. Mamy wiele okazji, aby to zrobić i nie powinniśmy się wahać."
 FRA_over_the_alps_desc: "W czasie wojen Napoleońskich Szwajcaria była jednym z państw które bardzo szybko uległo fali rewolucji francuskiej. W dobie dzisiejszych zagrożeń ze strony totalitaryzmów czujemy się zoobowiązani wziąć ten kraj pod swoją protekcję poprzez ustanowienie tam naszego wielkiego lidera Napoleona VI. Tylko tak jesteśmy w stanie obronić naród Szwajcarski jednocześnie sami umacniając swoją pozycję w Europie zachodniej i południowej."
 FRA_over_the_spain_desc: "Hiszpania w trakcie wojen Napoleońskich przez bardzo długi czas była naszym sojusznikiem w walce z feudalnymi imperiami Europejskimi. Był to również ważny kraj w zwalczaniu hegemonii Brytyjskiej która to swoimi nakładami finansowymi trzymała system feudalny w ryzach. Niestety Hiszpania w kluczowym momencie zdradziła nasz kraj i przeszła na stronę wroga. W dobie Hiszpanii zrójnowanej przez wir wojny domowej, możemy wkońcu zaprowadzić tam porządek i pogonić tamtejsze totalitaryzmy, ustanawiając tron Napoleona VI."
 FRA_over_the_portugal_desc: "Portugalia opanowana przez dyktaturę Salazara czerpie z dziedzictwa tyranów Europejskich których to Napoleon próbował powstrzymać. W celu oswobodzenia narodu Portugalskiego jesteśmy zoobowiązani do protekcji tego kraju dopuszczając tam rząd naszego lidera Napoleona VI."
 FRA_reorganize_southern_europe_desc: "Po udanych podbojach w Europię południowej należy wziąć pod uwagę wiele mniejszości etnicznych żyjących na tamtych terenach. Jako dobrzy władcy tego regionu zamierzamy zanieść wolność uciśnionym Galom i Baskom, jednocześnie zapewniając im autonomię w ramach naszego imperium."
 FRA_ally_switzerland_desc: "Szwajcaria po wojnach Napoleońskich wybrała drogę przeciwną do feudalnych mocarstw stawiając na wolny rynek i demokracje. Te ideały są nam wystarczająco bliskie by zabiegać o przymierze z tym narodem."
 FRA_align_portugal_desc: "Portugalia i jej imperium kolonialne byłby ważnym i silnym sojusznikiem w walce z czychającymi zagrożeniami z zachodu i północy. Z tego powodu powinniśmy zrobić wszystko, aby związać ten kraj z nami sojuszem."
 FRA_restore_eastern_alliances_desc: "W 1812 roku Napoleon okrzyknął swoją wyprawę na Rosję I Wojną Polską, by podkreślić ważność udziałów narodów Rzeczypospolitej w walce z carską Rosją. Dziś, gdy zagrożenia ze strony totalitaryzmów są tak duże, powinniśmy ponownie związać się z naszymi dawnymi sojusznikami z Europy Wschodniej i zapewnić im ochronę przed tymi zagrożeniami."
 FRA_alliance_with_belgrade_desc: "Jugosławia zagrożona ze strony dyktatur na południu Europy jest ważnym sojusznikiem w walce z tymi zagrożeniami. Powinniśmy zrobić wszystko, aby zapewnić im nasze wsparcie i ochronę."
 FRA_protect_romania_desc: "Rumunia jako kraj przed długi czas niewolony przez tyranów rozumie znaczenie wolności. Z tego względu powinniśmy ją chronić i wspierać."
 FRA_reaffirm_polish_independence_desc: "Rzeczypospolita Polska była jednym z niewielu sojuszników Napoleona do samego końca wojny. Jej zapał rewolucyjny nie raz przyprawiał francuzów o zadumę i podziw. Z tego względu będziemy się ubiegać o odnowienie przyjaźni polsko-francuskiej."
 FRA_POL_LIT_union_desc: "Unia Polsko-Litewska to unia znajdujący się po drugiej stronie Karpat. Czas ją przywrócić i rozszerzyć naszą władzę nad regionem."
 FRA_empire_desc: "Imperium Francuskie jest największym imperium na świecie i powinniśmy zrobić wszystko, aby je wzmocnić. Mamy wiele okazji, aby to zrobić i nie powinniśmy się wahać."
 FRA_force_de_frappe_desc: "Siła Uderzeniowa to potężna siła militarna znajdujący się po drugiej stronie świata. Czas ją wzmocnić i rozszerzyć naszą władzę nad regionem."
 FRA_joint_war_planning_desc: "Wspólne Planowanie Wojenne to potężna strategia militarna znajdujący się po drugiej stronie Karpat. Czas ją wzmocnić i rozszerzyć naszą władzę nad regionem."
 FRA_a_trip_to_quebec_desc: "Podróż do Quebecu to potężna strategia dyplomatyczna znajdujący się po drugiej stronie świata. Czas ją wzmocnić i rozszerzyć naszą władzę nad regionem."
 FRA_infulence_the_americas_desc: "Wpływanie na Amerykę to potężna strategia dyplomatyczna znajdujący się po drugiej stronie świata. Czas ją wzmocnić i rozszerzyć naszą władzę nad regionem."
 FRA_eastern_politics_desc: "Wschodnią Polityka to potężna strategia dyplomatyczna znajdujący się po drugiej stronie świata. Czas ją wzmocnić i rozszerzyć naszą władzę nad regionem."
 FRA_crush_the_threat_to_indochina_desc: "Imperium Japońskie zagraża naszym koloniom w Indochinach. Nie możemy pozwolić sobie na szantaż ze strony ich nacjonalistycznego i zamordystycznego reżimu. Powinniśmy zaatakować ich pierwsi prewecyjnie, by wyeliminować zagrożenie i zapewnić bezpieczeństwo naszym koloniom."
 FRA_imperial_ambitions_desc: "Francja zawsze miała imperialne ambicje i czas je realizować. Mamy wiele okazji, aby to zrobić i nie powinniśmy się wahać."
 FRA_attack_spain_desc: "Hiszpania w trakcie wojen Napoleońskich przez bardzo długi czas była naszym sojusznikiem w walce z feudalnymi imperiami Europejskimi. Był to również ważny kraj w zwalczaniu hegemonii Brytyjskiej która to swoimi nakładami finansowymi trzymała system feudalny w ryzach. Niestety Hiszpania w kluczowym momencie zdradziła nasz kraj i przeszła na stronę wroga. W dobie Hiszpanii zrójnowanej przez wir wojny domowej, możemy wkońcu zaprowadzić tam porządek i pogonić tamtejsze totalitaryzmy, ustanawiając tron Napoleona VI."
 FRA_secure_portugal_desc: "Portugalia opanowana przez dyktaturę Salazara czerpie z dziedzictwa tyranów Europejskich których to Napoleon próbował powstrzymać. W celu oswobodzenia narodu Portugalskiego jesteśmy zoobowiązani do protekcji tego kraju dopuszczając tam rząd naszego lidera Napoleona VI."
 FRA_austerlitz_legacy: "Dziedzictwo Austerlitz"
 FRA_austerlitz_legacy_desc: "Bitwa pod Austerlitzem była wielkim zwycięstwem dla Francji i czas uczcić jego dziedzictwo. Powinniśmy spróbować powtórzyć jego sukces i rozszerzyć naszą władzę nad regionem."
 FRA_influence_the_americas_desc: "Wpływanie na Amerykę to potężna strategia dyplomatyczna która może nam pomóc w rozroście naszego imperium. Czas ją wzmocnić i rozszerzyć naszą władzę nad regionem."
 FRA_invitation_SWI.t: "Zaproszenie dla Szwajcarii"
 FRA_invitation_SWI.d: "Państwo Francuskie oferuje sojusz Szwajcarii. Co powinniśmy zrobić?"
 FRA_invitation_SWI_accepted.t: "Szwajcaria akceptuje sojusz!"
 FRA_invitation_SWI_accepted.d: "Szwajcaria akceptuje sojusz z Francją i dołącza do frakcji Francuskiej."
 france.40.a: "Zaakceptuj sojusz"
 france.40.b: "Odrzuć sojusz"
 FRA_invitation_SWI_refused.t: "Szwajcaria odrzuca sojusz!"
 FRA_invitation_SWI_refused.d: "Szwajcaria odrzuca sojusz z Francją i pozostaje neutralna."
 france.42.a: "Złe wieści dla Francji"
 france.41.a: "Dobre wieści dla Francji"
 FRA_disunited_italy_desc: "Włochy to kraj znajdujący się po drugiej stronie Alp. Czas go rozdzielić i rozszerzyć naszą władzę nad regionem."
 FRA_disunite_italy: "Rozbić Włochy"
 FRA_disunite_italy_desc: "Włochy to kraj znajdujący się po drugiej stronie Alp. Czas go rozdzielić i rozszerzyć naszą władzę nad regionem."
 FRA_influence_the_americas: "Wpływanie na Amerykę Południową"
 FRA_trucks_replace_horses_desc: "Ciężarówki to potężna technologia, która może zastąpić konie w transporcie. Czas ją wprowadzić."
 FRA_trucks_replace_horses: "Ciężarówki zamiast koni"
 FRA_famous_artillery_desc: "Słynna Artyleria to potężna technologia, która może zastąpić nasze stare działa. Czas ją wprowadzić."
 FRA_famous_artillery: "Słynna Artyleria"
 FRA_grande_armee: "Wielka Armia"
 FRA_grande_armee_desc: "Wielka Armia to potężna siła militarna, która może zastąpić nasze stare armie. Czas ją wprowadzić i rozszerzyć naszą władzę nad regionem."
 FRA_maintain_the_entente: "Utrzymać Ententę"
 FRA_maintain_the_entente_desc: "Ententa to potężny sojusz, który może zastąpić nasze stare sojusze. Czas go utrzymać i rozszerzyć."
 FRA_eastern_politics: "Wschodnia Polityka"
 FRA_new_colonies: "Nowe Kolonie"
 FRA_new_colonies_desc: "Kolonie to potężne źródło surowców i wpływów. Czas je zdobyć i rozszerzyć naszą władzę."
 FRA_third_invasion_of_mexico: "Trzecia Inwazja Meksyku"
 FRA_third_invasion_of_mexico_desc: "Meksyk to kraj znajdujący się po drugiej stronie Atlantyku. Czas go zaatakować."
 FRA_see_to_the_colonies_desc: "Kolonie to potężne źródło surowców i wpływów. Czas się nimi zająć."
 FRA_see_to_the_colonies: "Zająć się Koloniami"
 FRA_our_natural_borders: "Nasze Naturalne Granice"
 FRA_our_natural_borders_desc: "Nasze naturalne granice to potężne źródło bezpieczeństwa i wpływów. Czas je zabezpieczyć i rozszerzyć."
 FRA_reorganize_the_belgium_and_luxembourg_desc: "Belgia i Luksemburg to kraje kluczowe do naszej dominacji w Europie. Czas je zreorganizować i rozszerzyć naszą władzę."
 FRA_reorganize_the_belgium_and_luxembourg: "Reorganizacja Belgii i Luksemburga"
 FRA_joint_weapons_development_desc: "Wspólny Rozwój Broni to potężna technologia, która może zastąpić nasze stare technologie. Czas ją wprowadzić i rozszerzyć."
 FRA_joint_weapons_development: "Wspólny Rozwój Broni"
 FRA_rebuild_Marine_nationale_desc: "Odbudowa Marine Nationale to potężna technologia, która może zastąpić nasze stare floty. Czas ją wprowadzić."
 FRA_rebuild_Marine_nationale: "Odbudowa Marine Nationale"
 FRA_emergency_powers_to_petain: "Rząd wojskowy Petaina"
 FRA_emergency_powers_to_petain_desc: "Przyznanie Petainowi nadzwyczajnych uprawnień pozwoli na bardziej zdecydowane działanie w czasach kryzysu."
 FRA_cult_of_the_french_soldier: "Kult francuskiego żołnierza"
 FRA_cult_of_the_french_soldier_desc: "Kult francuskiego żołnierza reprezentuje poczucie przynależności do francuskiej tradycji wojskowej i poświęcenia, które złożyli jej żołnierze."
 FRA_legacy_of_verdun: "Dziedzictwo Verdun"
 FRA_legacy_of_verdun_desc: "Dziedzictwo Verdun reprezentuje odporność i determinację francuskich ludzi wobec trudności."
 FRA_revenge_for_1870: "Mściciel za porażkę 1870" 
 FRA_revenge_for_1870_desc: "Musimy zemścić się za porażkę 1870 i przywrócić honor francuski."
 FRA_petain_industry: "Przezbrojenie Petaina"
 FRA_petain_industry_desc: "Pod przywództwem Petaina skupimy się na przezbrojeniu naszego narodu, aby bronić się przed wszelkimi przyszłymi zagrożeniami."
 FRA_pre-strike_on_Germany: "Atak wyprzedzający na Niemcy"
 FRA_pre-strike_on_Germany_desc: "Atak wyprzedzający na Niemcy mógłby zaskoczyć ich i dać nam strategiczną przewagę."
 FRA_army_of_third_republic: "Armia Trzeciej Republiki"
 FRA_army_of_third_republic_desc: "Armia Trzeciej Republiki była symbolem narodowego pyta i siły. Będziemy wyciągać inspirację z jej dziedzictwa, aby zbudować potężną siłę wojskową."
 FRA_Defending_of_the_New_Republic: "Obrona Nowej Republiki"
 FRA_Defending_of_the_New_Republic_desc: "Musimy zapewnić, że Nowa Republika utrzyma się przeciwko zarówno wewnętrznej niezgody, jak i zewnętrznych zagrożeń."
 FRA_delegram_to_berlin: "Delegram to Berlin"
 FRA_delegram_to_berlin_desc: "Współpraca z Niemcami zapewni nam silną ochronę i wpływ, ale kosztuje naszą niezależność."
 FRA_fate_of_benelux: "Los Beneluksu"
 FRA_fate_of_benelux_desc: "Los Belgii, Holandii i Luksemburga zależy teraz od wyborów, które podejmujemy dla polityki zagranicznej Francji."
 FRA_end_of_the_republic: "Koniec Republiki"
 FRA_end_of_the_republic_desc: "Republika służyła nam dobrze, ale czas na nową erę. Musimy być gotowi na poświęcenia dla większego dobra naszej narodu."
 FRA_franco_german_Cooperation: "Współpraca francusko-niemiecka"
 FRA_franco_german_Cooperation_desc: "Współpraca z Niemcami pozwoli nam odbudować gospodarkę i armię, ale musimy być ostrożni, aby nie stać się zbyt zależnymi od nich."
 FRA_germanify_france: "Przyjęcie kultury niemieckiej"
 FRA_germanify_france_desc: "Przyjmując kulturę niemiecką, możemy wzmocnić nasze relacje z naszymi północnymi sąsiadami i promować poczucie wspólnej tożsamości."
 FRA_The_Paris-Berlin_Military_Pact: "Pakt wojskowy Paryż-Berlin"
 FRA_The_Paris-Berlin_Military_Pact_desc: "Pakt wojskowy z Niemcami zapewni nam silnego sojusznika, ale musimy zagwarantować, że nasze interesy będą chronione w każdym porozumieniu."
 FRA_New_Identity_for_France: "Nowa tożsamość dla Francji"
 FRA_New_Identity_for_France_desc: "Musimy przedefiniować to, co oznacza być Francuzem w tej nowej erze, jednocześnie embracing naszą historię i patrząc ku jaśniejszej przyszłości."
 FRA_New_order_in_europe: "Nowy porządek w Europie"
 FRA_New_order_in_europe_desc: "Poprzez ustanowienie nowego porządku w Europie, możemy zapewnić stabilność i dobrobyt dla naszego narodu i całego kontynentu."
 FRA_final_shoutdown: "Ostateczna walka"
 FRA_final_shoutdown_desc: "W ostatnich chwilach naszej walki, musimy dać z siebie wszystko i walczyć do końca. Naszym wrogom nie pokażemy litości, więc nie pokażemy ich też żadnej."
 FRA_ateism_in_french_society: "Ateizm w społeczeństwie francuskim"
 FRA_ateism_in_french_society_desc: "Kościół katolicki był długo służył jako podpora społeczeństwa francuskiego, ale jego wpływ osłabiał w ostatnich latach. Musimy zdecydować się, czy"
 FRA_carry_the_revolution_benelux: "Poprowadzenie rewolucji do Beneluksu"
 FRA_carry_the_revolution_benelux_desc: "The Benelux countries are under threat from the forces of reaction. We must support the leftist movements there to ensure thatthey do not fall under the sway of fascism." "Kraje Beneluksu są zagrożone przez siły reakcji. Musimy wspierać tamtejsze ruchy lewicowe, aby zapewnić, że nie wpadną w sidła faszyzmu."
 FRA_red_flood: "Red Flood" 
 FRA_red_flood_desc:"Rzeka Ren nigdy nie była granicą; była blizną na ciele Europy. Teraz, gdy germańskie bestia została przywieziona do kolan, nadszedł czas, aby przestała istnieć jako naród i zamiast tego stała się płótnem. Nie będzie już Niemiec, nie będzie już Prus, tylko surowa materia, którą nasza Sztuka ukształtuje w Nowy Porządek. To, co kiedyś było Berlinem, stanie się naszym najbardziej wysuniętym na wschód galerią."
 FRA_carry_the_revolution_switzerland: "Poprowadzenie rewolucji do Szwajcarii"
 FRA_carry_the_revolution_switzerland_desc: "Szwajcaria od dawna jest bastionem neutralności, ale jej banki były schronieniem dla aktywów sił reakcji. Musimy wspierać tamtejsze ruchy lewicowe, aby zapewnić, że nie będą nadal udzielać wsparcia finansowego naszym wrogom."
 FRA_give_portugal_to_spain: "Oddaj Portugalię Hiszpanii"
 FRA_give_portugal_to_spain_desc: "Portugalia była dla nas zbyt długo cierniem w boku. Oddając ją Hiszpanii, możemy zapewnić, że będzie pod kontrolą przyjaznego rządu i usunąć potencjalne źródło niestabilności z naszych granic."
 FRA_unite_iberia: "Zjednoczenie Półwyspu Iberyjskiego"
 FRA_unite_iberia_desc: "Podział Półwyspu Iberyjskiego od dawna jest źródłem słabości. Zjednoczenie Hiszpanii i Portugalii pod jednym rządem pozwoli nam stworzyć potężnego sojusznika i zapewnić stabilność w regionie."
 FRA_ask_the_benelux: "Poproś Beneluks o pomoc"
 FRA_ask_the_benelux_desc: "Kraje Beneluksu były źródłem wsparcia dla nas w przeszłości. Musimy ponownie złożyć im prośbę o pomoc w naszym czasie potrzeb."
 FRA_never_another_sadowa: "Nigdy więcej Sadowy"
 FRA_never_another_sadowa_desc: "Bitwa pod Sadową była zniszczeniem dla Francji, i musimy zapewnić, że taki disaster nigdy się nie powtarza. Inwestujemy w naszą armię i zapewniamy, że zawsze jesteśmy gotowi do obrony naszej nacji przed jakimkolwiek zagrożeniem"
 FRA_natural_alies: "Naturalni sojusznicy"
 FRA_natural_alies_desc: "Francja zawsze miała naturalnych sojuszników na świecie, i musimy wzmocnić nasze więzi z nimi. Pracując razem, możemy stworzyć potężną koalicję, która będzie w stanie stawić czoła każdemu zagrożeniu i zapewnić bezpieczeństwo i dobrobyt naszej nacji."
 FRA_strengthen_the_entente: "Wzmocnienie Ententy"
 FRA_strengthen_the_entente_desc: "Ententa była filarem naszej polityki zagranicznej przez dziesięciolecia i musimy nadal ją wzmacniać. Pracując ściśle z naszymi sojusznikami, możemy stworzyć zjednoczony front przeciwko naszym wrogom i zapewnić, że jesteśmy przygotowani na każdą ewentualność."
 FRA_strengthen_the_entente_tt: "Wzmocenie Ententy zwiększy nasze stosunki z Wielką Brytanią i ZSRR, ale może również wciągnąć nas w ich konflikty i uczynić nas celem dla ich wrogów."
 FRA_anti_fascist_Crusade_desc: "Faszyzm jest zagrożeniem dla całej ludzkości, i musimy stanąć przeciwko niemu. Poprzez rozpoczęcie antyfaszystowskiej krucjaty, możemy zjednoczyć siły demokracji i wolności na całym świecie i zadać cios siłom reakcji."
 FRA_constitutional_monarchy: "Monarchia konstytucyjna"
 FRA_constitutional_monarchy_desc: "Monarchia była symbolem stabilności i tradycji w Francji przez wieki. Przez przywrócenie jej w formie konstytucyjnej, możemy zapewnić jednolitego lidera dla naszej nacji i zagwarantować, że nasza rządzenie będzie odpowiedzialne wobec ludu."
 FRA_defender_of_liberty: "Obrońca Wolności"
 FRA_defender_of_liberty_desc: "Wolność jest fundamentem naszej nacji, i musimy jej bronić za wszelką cenę. Stając w obronie naszych zasad i walcząc przeciwko tyranii, możemy zapewnić, że nasza nacja pozostanie latarnią wolności i demokracji na świecie."
 FRA_freedom_of_knowledge: "Wolność umysłu"
 FRA_freedom_of_knowledge_desc: "Wiedza jest siłą, a my musimy zapewnić, że jest dostępna dla wszystkich. Promując wolność myślenia i wyrażania, możemy stworzyć społeczeństwo, które ceni uczenie się i innowacje."
 FRA_appel_to_the_absolitists: "Apel do absolutystów"
 FRA_appel_to_the_absolitists_desc: "Absolutystów od dawna uważamy za cierń w naszej stronie, ale nadal mają znaczący wpływ. Poprzez apelowanie do nich i oferowanie im miejsca w naszym nowym porządku, możemy zneutralizować ich opozycję i zyskać ich poparcie dla naszej sprawy."
 FRA_rebuild_the_empire: "Odbuduj Imperium"
 FRA_rebuild_the_empire_desc: "Imperium Francuskie było kiedyś potężną siłą na świecie, i musimy dążyć do jego odbudowy. Poprzez rozszerzenie naszego wpływu i ustanowienie kolonii, możemy stworzyć nowe imperium, które odzwierciedla nasze wartości i interesy."
 FRA_franco_german_cooperation_idea: "Współpraca francusko-niemiecka"
 FRA_franco_german_cooperation_idea_desc: "Rządy Niemiec i Francji współpracują, aby znaleźć wspólny język i poprawić stosunki między dwoma narodami. Ta współpraca doprowadziła do zwiększenia handlu i wymiany kulturalnej, a także wspólnych wysiłków w celu rozwiązania wspólnych wyzwań, takich jak bezpieczeństwo i zmiany klimatyczne."
 FRA_new_identity_for_france_idea: "Nowa tożsamość dla Francji"
 FRA_new_identity_for_france_idea_desc: "W obliczu zmian, jakie przyniósł Wielka Wojna, Francja zmaga się z kwestią swojej tożsamości narodowej. Wojna pozostawiła głębokie blizny na narodzie, a wielu zadaje sobie pytanie, co to znaczy być Francuzem w tej nowej erze. Niektórzy nawołują do powrotu do tradycyjnych wartości i skupienia się na dumie narodowej, podczas gdy inni opowiadają się za bardziej inkluzywną i różnorodną wizją Francji, która obejmuje jej wielokulturowe dziedzictwo. Debata na temat tożsamości Francji trwa nadal i prawdopodobnie będzie kształtować przyszłość kraju przez wiele lat."
 FRA_New_order_in_Europe_idea: "Nowy porządek w Europie"
 FRA_New_order_in_Europe_idea_desc: "Polityczna mapa Europy szybko się zmienia, z nowymi sojuszami tworzącymi się i starymi rozpadającymi się. Wzrost faszyzmu i komunizmu stworzył nowy porządek w Europie, z niektórymi krajami sprzymierzającymi się z jedną ideologią lub drugą."
 FRA_final_shoutdown: "Ostateczna walka"
 FRA_final_shoutdown_desc: "Jako że świat pogrąża się w chaosie, Francja musi stawić ostateczny opór, aby bronić swoich wartości i sposobu życia. Los narodu wisi na włosku, a każdy obywatel musi zrobić swoją część, aby zapewnić zwycięstwo Francji. Świat może się zmieniać, ale Francja przetrwa. Vive la France!"
 FRA_end_of_the_republic_idea: "Koniec Republiki"
 FRA_end_of_the_republic_idea_desc: "Republika była symbolem wolności i demokracji przez wiele wieków, ale była również przesłaniana przez korupcję i nieskuteczność. W miarę jak świat staje się bardziej złożony i wyzwanie, niektórzy wywołują nową formę rządu, która może lepiej odpowiadać na potrzeby ludu."
 FRA_cult_of_the_french_soldier: "Kult francuskiego żołnierza"
 FRA_cult_of_the_french_soldier_desc: "Francuski żołnierz od dawna jest czczony jako symbol odwagi i poświęcenia. Kult francuskiego żołnierza jest świadectwem trwałego dziedzictwa tych, którzy służyli swojemu krajowi z honorem i wyróżnieniem podczas Wielkiej Wojny."
 FRA_legacy_of_verdun_focus: "Dziedzictwo Verdun"
 FRA_legacy_of_verdun_focus_desc: "Bitwa pod Verdun była jedną z najdłuższych i najkrwawszych bitew Wielkiej Wojny, a jej dziedzictwo nadal kształtuje francuską tożsamość narodową. Odporność i determinacja francuskich żołnierzy walczących pod Verdun stała się symbolem narodowej dumy i poświęcenia. Bitwa jest pamiętana jako świadectwo siły i odwagi francuskiego narodu, a także przypomnienie o poświęceniach dokonanych w obronie naszej ojczyzny. Dziedzictwo Verdun nie dotyczy tylko przeszłości, ale także wartości wytrwałości i jedności, które nadal definiują francuskiego ducha dzisiaj. Jest to przypomnienie, że nawet w najciemniejszych czasach, francuski naród może się zjednoczyć i pokonać każde wyzwanie."
 army_of_third_republic: "Armia Trzeciej Republiki"
 army_of_third_republic_desc: "Armia Trzeciej Republiki stanowi najwyższy symbol narodowej dumy i odporności w naszej nowoczesnej erze. Mimo ongoing wyzwań politycznych i zniszczeń wynikających z Wielkiej Wojny, armia pozostaje nieustępliwa tarczą narodu. Żołnierze naszej Republiki, znani z nieustępliwej odwagi, zabezpieczyli pozycję Francji na świecie dzięki ostatniemu zwycięstwu. Dziedzictwo tej armii inspiruje każdego obywatela dzisiaj, pełniąc rolę życiowego przypomnienia o poświęceniach dokonanych w celu przywrócenia naszych granic i absolutnej potrzeby jedności narodowej w obliczu obecnych europejskich napięć."
 Defending_of_the_New_Republic: "Obrona Nowej Republiki"
 Defending_of_the_New_Republic_desc: "Nowa Republika nie jest tylko nazwą; reprezentuje naszą wspólną nadzieję na lepszą przyszłość. Musimy stać zjednoczeni, wzmacniając nasze obrony i budując odporność, aby zapewnić, że ideały wolności, równości i braterstwa przetrwają. Obrona Nowej Republiki to nie tylko obowiązek; to świadectwo naszego zaangażowania w ochronę wartości, które definiują nas jako naród."
 FRA_strengthen_the_union_idea: "Wzomacniajmy Związek Zawodowy"
 FRA_strengthen_the_union_idea_desc: "W obliczu rosnących wewnętrznych i zewnętrznych nacisków, kluczowe jest, abyśmy wzmocnili więzi, które łączą nasz naród. Jedność naszego ludu jest naszą największą siłą, i musimy pracować niestrudzenie, aby promować poczucie solidarności i wspólnego celu. Poprzez promowanie inkluzywności, wspieranie naszych weteranów i inwestowanie w nasze społeczności, możemy zbudować silniejszą i bardziej odporną Francję. Razem możemy pokonać każde wyzwanie i zapewnić prosperującą przyszłość dla wszystkich."
 FRA_democratic_mobilization: "Demokratyczna mobilizacja"
 FRA_bastion_of_democracy: "Bastion demokracji"
 FRA_New_order_in_Europe: "Nowy porządek w Europie"
 FRA_anti_fascist_Crusade: "Antyfaszystowska krucjata"
 FRA_return_to_Piemont: "Powrót do Piemontu"
 FRA_return_to_Piemont_desc: "Nadszedł czas, aby przywrócić francuską administrację w Turynie i odzyskać nasze historyczne wpływy za Alpami. Piemont musi ponownie stać się częścią naszej strefy interesów”
 FRA_artillery_idea: "Słynna Artyleria"
 FRA_artillery_idea_desc: "Słynna Artyleria to potężna technologia, która może zastąpić nasze stare działa. Czas ją wprowadzić i rozszerzyć naszą władzę nad regionem."
 FRA_trucks_idea: "Ciężarówki zamiast koni"
 FRA_trucks_idea_desc: "Ciężarówki to potężna technologia, która może zastąpić konie w transporcie. Czas ją wprowadzić i rozszerzyć naszą władzę nad regionem."
 FRA_imperial_ambitions : "Imperialne ambicje"
 FRA_imperial_ambitions_desc: "Francja zawsze miała imperialne ambicje i czas je realizować. Mamy wiele okazji, aby to zrobić i nie powinniśmy się wahać."
