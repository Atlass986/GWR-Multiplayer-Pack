spain.25.t: "Dominicana Refuses"
spain.25.d: "Our diplomats have returned from Santo Domingo empty-handed. The government of the Dominican Republic has firmly rejected our proposal, declaring that the nation's sovereignty is not for sale at any price. Despite our efforts and generous offers, Dominican officials remain determined to preserve their independence. Any further attempts to bring the country under Spanish influence may now require methods beyond diplomacy."
spain.23.a: "Sure Let's sell it to them"
spain.23.b: "No way the are for real"
spain.23.t: "The Purchase of the Bahamas"
spain.23.d: "After lengthy negotiations, an agreement has been reached for the transfer of the Bahamas to Spanish control. The acquisition secures a valuable strategic position in the Caribbean, extends our influence across the Atlantic, and strengthens Spain's presence in the region. While some question the cost of the deal, many see it as a significant step toward restoring Spain's status as a major colonial power."
spain.21.b: "It's simply not worth the effort"
spain.21.d: "French Government refused any talks with Us."
spain.21.t: "French Refused to Negotiate"
spain.21.a: "Alright Let's pay them"
spain.20.t: "French Sold Us Morroco"
spain.20.d:"The French government has agreed to our proposal and transferred control of Morocco in exchange for financial compensation. This historic agreement marks a major diplomatic victory for Spain, expanding our influence in North Africa without the need for military action. The integration of these territories will strengthen our strategic position and restore Spanish prestige on the world stage."
spain.19: "We Ain't Selling Them Shii..."
spain.18.a: "Igh't Let's Sell it To Them"
spain.18.t: "Spain wants To Buy Morroco From Us"
spain.18.d: "The Spanish government has approached France with an unexpected diplomatic proposal. Madrid seeks to purchase the French territories in Morocco, arguing that a unified Moroccan administration under Spanish control would strengthen regional stability and improve economic development in North Africa."
spain.17.a: "Unfortunet"
spain.17.t: "Portugal Refuses our Proposal to Revisit the Treaty of Tordesillas"
spain.17.d: "Portugal has refused our proposal to revisit the Treaty of Tordesillas, which divided the world between Spain and Portugal in 1494. This will significantly impact our strategic position in the region, as it will prevent us from gaining control over the territories that were previously under Portuguese control."
spain.16.t: "Spain wants to revisit Treaty of Tordesillas"
spain.16.d: "Spain has approached us with a proposal to revisit the Treaty of Tordesillas, which divided the world between Spain and Portugal in 1494. This would significantly impact our strategic position in the region, as it would give us control over the territories that were previously under Portuguese control."
spain.16.a: "Sure, let's revisit it"
spain.16.b: "No way, we can't let them have it"
spain.15.a: "War it is then"
spain.15.b: "It is simply not worth the effort"
uk_spain_focus.13.t: "United Kingdom Refuses to Sell Gibraltar"
uk_spain_focus.13.d: "After negotiations, the United Kingdom has refused to sell Gibraltar to us. This is a huge blow for our country, as it will prevent us from gaining control over the strategic location and the valuable resources in the area."
uk_spain_focus.12.t: "United Kingdom Agrees to Sell Gibraltar"
uk_spain_focus.12.d: "After negotiations, the United Kingdom has finally agreed to sell Gibraltar to us. This is a huge win for our country, as it will give us control over the strategic location and the valuable resources in the area."
spain.13.a: "Sure, let's sell it to them"
spain.13.b: "No way, we can't let them have it"
spain.14.a: "Great"
