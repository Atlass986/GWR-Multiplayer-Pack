GWRMP_SI_event.2.t:0 "[FROM.GetNameDefCap] żąda pokojowego przekazania regionu [?FROM.requested_state_@ROOT.GetName]!"
GWRMP_SI_event.2.desc:0 "Kanały dyplomatyczne rozbrzmiewają nagłą, pilną aktywnością. Dyplomaci z [FROM.GetNameDef] dostarczyli stanowczy, formalny komunikat. Przedstawiają strategiczne roszczenia do regionu [?FROM.requested_state_@ROOT.GetName], który obecnie znajduje się pod naszą administracją. Dokument prosi — a właściwie nalega — o pokojowe i natychmiastowe przekazanie terytorium pod ich kontrolę."
GWRMP_SI_event.2.a:0 "Wojna kosztowałaby nas więcej."
GWRMP_SI_event.2.b:0 "Przyjdźcie i weźcie!"
GWRMP_SI_event.3.t:0 "[FROM.GetNameDefCap] odrzuca pokojowe przekazanie regionu [?ROOT.requested_state_@FROM.GetName]"
GWRMP_SI_event.3.desc:0 "Nasza hojna oferta przekazania regionu [?ROOT.requested_state_@FROM.GetName] spotkała się z pogardą i buntem. Ich rząd odmówił uznania rozsądku. Ich upór nie pozostawia nam wyboru poza rozważeniem innych, bardziej \"bezpośrednich\" sposobów zabezpieczenia tego, co słusznie nam się należy."
GWRMP_SI_event.3.a:0 "Poczekamy... na razie."
GWRMP_SI_event.3.b:0 "Ich bunt będzie ich zgubą."
GWRMP_SI_event.4.t:0 "[FROM.GetNameDefCap] żąda naszego podporządkowania"
GWRMP_SI_event.4.desc:0 "[FROM.GetNameDefCap], ośmielone własną siłą albo naszą domniemaną słabością, wystosowało upokarzające ultimatum. Żądają nie tylko terytorium, lecz naszej suwerenności. Mamy całkowicie się podporządkować i zostać państwem marionetkowym pod ich dominacją. Przyjęcie oznaczałoby koniec naszej niezależnej polityki zagranicznej."
GWRMP_SI_event.4.a:0 "Lepiej podporządkować się bez rozlewu krwi."
GWRMP_SI_event.4.b:0 "Umrzemy wolni!"
GWRMP_SI_event.5.t:0 "[FROM.GetNameDefCap] odrzuca nasze żądanie podporządkowania"
GWRMP_SI_event.5.desc:0 "[FROM.GetNameDefCap] ośmieliło się odrzucić naszą wielkoduszną ofertę ochrony i integracji z naszą strefą wpływów. Ich lekkomyślna duma zaślepia ich wobec nowego porządku, który powstaje. Wybierają pozostanie przeszkodą na drodze do postępu."
GWRMP_SI_event.5.a:0 "Nie możemy sobie pozwolić na wojnę."
GWRMP_SI_event.5.b:0 "Zmiażdżymy ich opór."
GWRMP_SI_event.6.t:0 "[FROM.GetNameDefCap] oddaje swój region"
GWRMP_SI_event.6.desc:0 "Pod ogromną presją dyplomatyczną i w obliczu groźby konfliktu rząd państwa [FROM.GetNameDef] ogłosił bezwarunkowe przekazanie jednego ze swoich regionów. Przekazanie odbyło się po cichu, przy minimalnej ceremonii, oznaczając znaczącą zmianę regionalnej równowagi sił bez oddania choćby jednego strzału."
GWRMP_SI_event.6.a:0 "Równowaga sił się zmienia."
GWRMP_SI_event.7.t:0 "[FROM.GetNameDefCap] zostaje zwasalizowane"
GWRMP_SI_event.7.desc:0 "W obliczu przytłaczającej presji administracja [FROM.GetNameDef] podpisała traktat wasalny, skutecznie zrzekając się swojej suwerenności. Choć ich flaga nadal może powiewać, ich polityka i armie są teraz kierowane z obcej stolicy."
GWRMP_SI_event.7.a:0 "Równowaga sił się zmienia."
GWRMP_SI_event.8.t:0 "§2[FROM.GetNameDefCap]§! prosi o prawa do zasobów w regionie §t[?FROM.requested_resource_state.GetName]§!"
GWRMP_SI_event.8.desc:0 "§t[?FROM.requested_resource_state.GetName]§! to bogaty region. Czy chcemy przekazać im te zasoby?"
GWRMP_SI_event.8.a:0 "Zgadzamy się"
GWRMP_SI_event.8.b:0 "Wynocha!"
GWRMP_SI_event.9.t:0 "§2[FROM.GetNameDefCap]§! zgadza się!"
GWRMP_SI_event.9.a:0 "Tak się negocjuje!"
GWRMP_SI_event.9.desc:0 "Oferta przyjęta!"
GWRMP_SI_event.10.t:0 "§2[FROM.GetNameDefCap]§! odmawia!"
GWRMP_SI_event.10.a:0 "Jaka szkoda!"
GWRMP_SI_event.10.desc:0 "Oferta odrzucona!"
