FRA_empire_francais_desc: "The French Empire is the greatest empire in the world and we should do everything in our power to expand it. We have many opportunities to do so and we should not hesitate to take them."
FRA_over_the_alps_desc: "During the Napoleonic War, Switzerland was one of the countries that quickly followed the wave of the French Revolution. In an era of totalitarianism, we feel compelled to unite ten countries under your protection by establishing our great leader, Napoleon VI, there. Only in this way can we defend the Swiss nation, which then activated our connection in switches and switches."
FRA_over_the_spain_desc: "During the Napoleonic Wars, Spain was our ally for a very long time in the fight against the feudal empires of Europe. It was also an important country in the fight against British hegemony, which with its financial outlays kept the feudal system in check. Unfortunately, Spain betrayed our country at a crucial moment and joined the enemy. With Spain devastated by the maelstrom of civil war, we can finally restore order there and drive out the totalitarian regimes there, establishing Napoleon VI on the throne."
FRA_over_the_portugal_desc: "Portugal, ruled by the Salazar dictatorship, draws on the legacy of the European tyrants whom Napoleon tried to stop. In order to liberate the Portuguese people, we are obliged to protect this country by allowing the government of our leader, Napoleon VI, to exist there."
FRA_reorganize_southern_europe_desc: "Following the successful conquests of southern Europe, the many ethnic minorities living there must be taken into account. As good rulers of this region, we intend to bring freedom to the oppressed Gauls and Basques, while ensuring their autonomy within our empire."
FRA_ally_switzerland_desc: "After the Napoleonic Wars, Switzerland chose a path opposite to the feudal powers, opting for a free market and democracy. These ideals are close enough to us to seek an alliance with this nation."
FRA_our_old_allies_desc: "We should try to restore our old alliances with the countries of Western Europe. They are still in need of our help and we should not forget about them."
FRA_align_portugal_desc: "Portugal and its colonial empire would be an important and strong ally in the fight against lurking threats from the west and north. For this reason, we should do everything to bind this country to us in an alliance."
FRA_restore_eastern_alliances_desc: "In 1812, Napoleon hailed his expedition to Russia as the First Polish War to emphasize the importance of the Polish-Lithuanian Commonwealth's participation in the fight against Tsarist Russia. Today, when the threats from totalitarianism are so great, we should reconnect with our former allies in Eastern Europe and provide them with protection against these threats."
FRA_alliance_with_belgrade_desc: "Yugoslavia, threatened by dictatorships in southern Europe, is an important ally in the fight against these threats. We should do everything to provide them with our support and protection."
FRA_protect_romania_desc: "Romania, as a country long enslaved by tyrants, understands the importance of freedom. Therefore, we should protect and support it."
FRA_reaffirm_polish_independence_desc: "The Republic of Poland was one of Napoleon's few allies until the very end of the war. Its revolutionary zeal often filled the French with wonder and admiration. For this reason, we will strive to renew Polish-French friendship."
FRA_POL_LIT_union_desc: "The Polish-Lithuanian Union is a union that is located on the other side of the Carpathians. It is time to restore it and expand our influence over the region."
FRA_empire_desc: "The French Empire is the greatest empire in the world and we should do everything in our power to reinforce it. We have many opportunities to do so and we should not hesitate to take them."
FRA_force_de_frappe_desc: "The Force de Frappe is a powerful military force that is located on the other side of the World. It is time to reinforce it and expand our influence over the region."
FRA_joint_war_planning_desc: "  Joint War Planning is a powerful military strategy that is located on the other side of the Carpathians. It is time to reinforce it and expand our influence over the region."
FRA_a_trip_to_quebec_desc: "A Trip to Quebec is a powerful diplomatic strategy that is located on the other side of the World. It is time to reinforce it and expand our influence over the region."
FRA_infulence_the_americas_desc: "Influence the Americas is a powerful diplomatic strategy that is located on the other side of the World. It is time to reinforce it and expand our influence over the region."
FRA_eastern_politics_desc: "Eastern Politics is a powerful diplomatic strategy that is located on the other side of the World. It is time to reinforce it and expand our influence over the region."
FRA_crush_the_threat_to_indochina_desc: "The Japanese Empire threatens our colonies in Indochina. We cannot afford to be blackmailed by their nationalist and murderous regime. We should attack them first, preemptively, to eliminate the threat and ensure the security of our colonies."  
