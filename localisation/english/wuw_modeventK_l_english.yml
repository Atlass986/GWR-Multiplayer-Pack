FRA_austerlitz_legacy_desc: "The Battle of Austerlitz was a great victory for France and it is time to honor its legacy. We should try to replicate its success and expand our influence over the region."
FRA_influence_the_americas_desc: "Influence the Americas is a powerful diplomatic strategy that is located on the other side of the Atlantic. It is time to reinforce it and expand our influence over the region."
