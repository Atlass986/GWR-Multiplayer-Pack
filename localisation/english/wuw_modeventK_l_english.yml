FRA_imperial_ambitions_desc: "France has always had imperial ambitions and it is time to fulfill them. We have many opportunities to do so and we should not hesitate to take them."
FRA_attack_spain_desc: "During the Napoleonic Wars, Spain was our ally for a very long time in the fight against the feudal empires of Europe. It was also an important country in the fight against British hegemony, which with its financial outlays kept the feudal system in check. Unfortunately, Spain betrayed our country at a crucial moment and joined the enemy. With Spain devastated by the maelstrom of civil war, we can finally restore order there and drive out the totalitarian regimes there, establishing Napoleon VI on the throne."
